name: "Terraform check provider mix (un entorno)"
description: "Genera el plan de este entorno (una sola vez; lo reutiliza intacto el job apply, nunca lo recalcula -- FR-009/FR-010, ADR 0008) y expone si FR-014 (002-single-provider-deployment) detecta mezcla de proveedores, para decidir si ese entorno necesita el gate manual de manual-review antes de aplicar. ADR 0007: environments/ es un root compartido, parametrizado por <environment>. Se usa para los tres entornos por igual, incluido production (antes de ADR 0009, production aplicaba sin generar ningun plan previo)."

inputs:
  environment:
    required: true
    description: "dev, staging o production"
  azure-client-id:
    required: true
  azure-tenant-id:
    required: true
  azure-subscription-id:
    required: true
  railway-token:
    required: true
  tfc-token:
    required: true
    description: "Token de API de HCP Terraform (backend de estado; ADR 0004), secreto TFC_API_TOKEN."
  tf-version:
    required: true

outputs:
  requires_review:
    description: "'true' si el plan de este entorno tiene cambios destructivos o la advertencia de mezcla de proveedores (FR-010/FR-014)."
    value: ${{ steps.check.outputs.requires_review }}

runs:
  using: "composite"
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.tf-version }}

    # ADR 0004: azure/login solo hace falta cuando ESTE entorno usa environment_provider =
    # "azure"; el backend de estado ya no depende de Azure para ningun entorno.
    - name: Leer environment_provider
      id: provider
      working-directory: environments
      shell: bash
      run: |
        PROVIDER=$(grep -oP 'environment_provider\s*=\s*"\K[^"]+' ${{ inputs.environment }}/environment.tfvars)
        echo "provider=${PROVIDER}" >> "$GITHUB_OUTPUT"

    - uses: azure/login@v2
      if: steps.provider.outputs.provider == 'azure'
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: terraform init
      working-directory: environments
      shell: bash
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.tfc-token }}
        # El bloque "cloud" (environments/backend.tf) no admite -backend-config (confirmado
        # 2026-11-11 contra un init real); se completa con estas variables (ADR 0007).
        TF_CLOUD_ORGANIZATION: angel-java
        TF_WORKSPACE: mailysoft-${{ inputs.environment }}
      run: terraform init -input=false

    - name: terraform plan (solo lectura)
      working-directory: environments
      shell: bash
      env:
        RAILWAY_TOKEN: ${{ inputs.railway-token }}
        TF_TOKEN_app_terraform_io: ${{ inputs.tfc-token }}
        TF_CLOUD_ORGANIZATION: angel-java
        TF_WORKSPACE: mailysoft-${{ inputs.environment }}
      run: |
        terraform plan -input=false -no-color -lock=false \
          -var-file="${{ inputs.environment }}/environment.tfvars" \
          -var-file="${{ inputs.environment }}/database.tfvars" \
          -var-file="${{ inputs.environment }}/services.tfvars" \
          -out=${{ inputs.environment }}.tfplan
        terraform show -json ${{ inputs.environment }}.tfplan > ${{ inputs.environment }}.plan.json

    - name: Evaluar FR-010 / FR-014
      id: check
      working-directory: environments
      shell: bash
      run: |
        HAS_DESTRUCTIVE=$(jq -r '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length > 0' ${{ inputs.environment }}.plan.json)
        HAS_PROVIDER_MIX=$(jq -r '[.checks[]? | select(.status == "fail")] | length > 0' ${{ inputs.environment }}.plan.json)
        if [ "$HAS_DESTRUCTIVE" = "true" ] || [ "$HAS_PROVIDER_MIX" = "true" ]; then
          echo "requires_review=true" >> "$GITHUB_OUTPUT"
        else
          echo "requires_review=false" >> "$GITHUB_OUTPUT"
        fi

    # contracts/plan-artifact-handoff.md "Productor: job check" -- este es EL plan que el job
    # apply de esta misma invocacion debe aplicar (FR-009); nunca se recalcula en apply.
    - name: Publicar el plan como artefacto (FR-009/FR-010)
      uses: actions/upload-artifact@v4
      with:
        name: tfplan-${{ inputs.environment }}
        path: environments/${{ inputs.environment }}.tfplan
        retention-days: 1
