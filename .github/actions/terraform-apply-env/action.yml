name: "Terraform apply (un entorno)"
description: "init -> apply para environments/ parametrizado por <environment>, usado por terraform-environment.yml (ADR 0007: root compartido; ADR 0009: workflow reutilizable). Aplica el plan que genero terraform-check-provider-mix en la misma invocacion (contracts/plan-artifact-handoff.md); nunca recalcula uno nuevo (FR-009/FR-010, ADR 0008)."

inputs:
  environment:
    required: true
    description: "dev, staging o production"
  azure-client-id:
    required: true
  azure-tenant-id:
    required: true
  azure-subscription-id:
    required: true
  railway-token:
    required: true
  tfc-token:
    required: true
    description: "Token de API de HCP Terraform (backend de estado; ADR 0004), secreto TFC_API_TOKEN."
  tf-version:
    required: true

runs:
  using: "composite"
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.tf-version }}

    # contracts/plan-artifact-handoff.md "Consumidor: job apply" -- descarga el plan EXACTO que
    # genero terraform-check-provider-mix en la misma invocacion de terraform-environment.yml.
    # Si el artefacto no existe (p. ej. el job check no corrio), este step falla y el job entero
    # falla con el -- nunca se sigue adelante sin el (FR-009/FR-010).
    - name: Descargar el plan generado por "check"
      uses: actions/download-artifact@v4
      with:
        name: tfplan-${{ inputs.environment }}
        path: environments

    # ADR 0004: azure/login solo hace falta cuando ESTE entorno usa environment_provider =
    # "azure" (modules/database/azure-existing y el provider azurerm real); el backend de
    # estado ya no depende de Azure para ningun entorno.
    - name: Leer environment_provider
      id: provider
      working-directory: environments
      shell: bash
      run: |
        PROVIDER=$(grep -oP 'environment_provider\s*=\s*"\K[^"]+' ${{ inputs.environment }}/environment.tfvars)
        echo "provider=${PROVIDER}" >> "$GITHUB_OUTPUT"

    - uses: azure/login@v2
      if: steps.provider.outputs.provider == 'azure'
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: terraform init
      working-directory: environments
      shell: bash
      env:
        TF_TOKEN_app_terraform_io: ${{ inputs.tfc-token }}
        # El bloque "cloud" (environments/backend.tf) no admite -backend-config (confirmado
        # 2026-11-11 contra un init real); se completa con estas variables (ADR 0007).
        TF_CLOUD_ORGANIZATION: angel-java
        TF_WORKSPACE: mailysoft-${{ inputs.environment }}
      run: terraform init -input=false

    - name: terraform apply (plan guardado -- FR-009, nunca -var-file/-auto-approve aqui)
      working-directory: environments
      shell: bash
      env:
        RAILWAY_TOKEN: ${{ inputs.railway-token }}
        TF_TOKEN_app_terraform_io: ${{ inputs.tfc-token }}
        TF_CLOUD_ORGANIZATION: angel-java
        TF_WORKSPACE: mailysoft-${{ inputs.environment }}
      run: |
        terraform apply -input=false -no-color ${{ inputs.environment }}.tfplan
