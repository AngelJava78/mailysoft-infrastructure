# Contrato: specs/001-railway-deployment/contracts/pipeline-contract.md y
# specs/002-single-provider-deployment/contracts/pipeline-contract-delta.md
# Se ejecuta tras merge a main. dev/staging aplican sin aprobacion adicional mas alla de la
# revision del PR, EXCEPTO cuando su plan tiene cambios destructivos (FR-010) o la
# advertencia de mezcla de proveedores (FR-014): ahi pasan por el mismo tipo de gate manual
# que production, vía el GitHub Environment "manual-review" (ver nota de configuracion abajo).
# production SOLO se aplica tras la aprobacion manual del GitHub Environment "production"
# (FR-009, T034 de 001-railway-deployment) — esa aprobacion la otorga nativamente GitHub al
# declarar `environment: production` en ese job, sin codigo adicional; como TODO cambio en
# production ya pasa por esa aprobacion, no necesita el gate condicional de dev/staging.
#
# ⚠️ CONFIGURACION MANUAL PENDIENTE (igual que T034 de 001-railway-deployment): este workflow
# asume que ya existe un GitHub Environment "manual-review" con al menos un "required
# reviewer" configurado en Settings → Environments del repositorio. Crear ese Environment es
# un ajuste de la consola de GitHub (no de Railway/Azure, por lo que no viola el Principio I),
# y queda fuera de lo que este cambio puede automatizar.

name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.0"
  TF_IN_AUTOMATION: "true"

jobs:
  check-dev:
    name: Revisar plan (dev)
    runs-on: ubuntu-latest
    outputs:
      requires_review: ${{ steps.check.outputs.requires_review }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./.github/actions/terraform-check-provider-mix
        with:
          environment: dev
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          railway-token: ${{ secrets.RAILWAY_TOKEN_DEV }}
          tf-version: ${{ env.TF_VERSION }}

  manual-review-dev:
    name: Revisión manual requerida (dev)
    runs-on: ubuntu-latest
    needs: check-dev
    if: needs.check-dev.outputs.requires_review == 'true'
    environment: manual-review # ver nota de configuracion manual al inicio del archivo
    steps:
      - run: echo "Cambio destructivo o mezcla de proveedores detectada en dev (FR-010/FR-014); aprobado."

  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    needs: [check-dev, manual-review-dev]
    if: always() && needs.check-dev.result == 'success' && (needs.manual-review-dev.result == 'success' || needs.manual-review-dev.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply-env
        with:
          environment: dev
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          railway-token: ${{ secrets.RAILWAY_TOKEN_DEV }}
          tf-version: ${{ env.TF_VERSION }}

  check-staging:
    name: Revisar plan (staging)
    runs-on: ubuntu-latest
    needs: apply-dev
    outputs:
      requires_review: ${{ steps.check.outputs.requires_review }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./.github/actions/terraform-check-provider-mix
        with:
          environment: staging
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          railway-token: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          tf-version: ${{ env.TF_VERSION }}

  manual-review-staging:
    name: Revisión manual requerida (staging)
    runs-on: ubuntu-latest
    needs: check-staging
    if: needs.check-staging.outputs.requires_review == 'true'
    environment: manual-review
    steps:
      - run: echo "Cambio destructivo o mezcla de proveedores detectada en staging (FR-010/FR-014); aprobado."

  apply-staging:
    name: Apply (staging)
    runs-on: ubuntu-latest
    needs: [check-staging, manual-review-staging]
    if: always() && needs.check-staging.result == 'success' && (needs.manual-review-staging.result == 'success' || needs.manual-review-staging.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply-env
        with:
          environment: staging
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          railway-token: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          tf-version: ${{ env.TF_VERSION }}

  apply-production:
    name: Apply (production)
    runs-on: ubuntu-latest
    needs: apply-staging
    # Declarar este environment es lo que activa el gate de aprobacion manual configurado en
    # GitHub (required reviewers — T034). El job queda pausado hasta la aprobacion, sin
    # necesidad de ningun paso adicional en este workflow (FR-009).
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-apply-env
        with:
          environment: production
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          railway-token: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          tf-version: ${{ env.TF_VERSION }}
