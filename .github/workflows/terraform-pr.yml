# Contrato: specs/001-railway-deployment/contracts/pipeline-contract.md
# En pull requests SOLO se ejecuta fmt -> validate -> lint -> security-scan -> plan (FR-008).
# Nunca se ejecuta apply aqui (ver terraform-apply.yml).
#
# ADR 0007: environments/ es un solo root de Terraform compartido por los tres entornos
# (environments/<entorno>/ solo contiene *.tfvars + backend.hcl, ya no copias de *.tf) —
# validate/lint/security-scan corren UNA vez sobre el root compartido (no por entorno, ya que
# el codigo es identico); solo init/plan necesitan repetirse por entorno (distinto backend y
# distintos valores de variables).

name: Terraform PR

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/terraform-pr.yml"

permissions:
  id-token: write # OIDC hacia Azure (research.md seccion 2)
  contents: read
  pull-requests: write # publicar el resultado del plan como comentario (FR-008)

env:
  TF_VERSION: "1.17.1" # confirmado 2026-11-09 contra la version real instalada — research.md seccion 7
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: Validar, lint y security-scan (root compartido)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (sin backend; solo valida sintaxis/modulos)
        working-directory: environments
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: environments
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --chdir=environments --config="${{ github.workspace }}/.tflint.hcl"

      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments
          config_file: .checkov.yaml
          quiet: true

  plan:
    name: Previsualizar (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ADR 0004: azure/login solo hace falta cuando ESTE entorno usa environment_provider =
      # "azure"; el backend de estado (HCP Terraform) ya no depende de Azure para ningun
      # entorno. OIDC, cuando aplica, NO esta acotado por entorno (bootstrap/azure-backend/oidc.tf);
      # la proteccion de production la aporta el gate de aprobacion de terraform-apply.yml.
      - name: Leer environment_provider
        id: provider
        working-directory: environments
        run: |
          PROVIDER=$(grep -oP 'environment_provider\s*=\s*"\K[^"]+' ${{ matrix.environment }}/environment.tfvars)
          echo "provider=${PROVIDER}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        if: steps.provider.outputs.provider == 'azure'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: environments
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TFC_API_TOKEN }}
          # El bloque "cloud" (environments/backend.tf) no admite -backend-config (confirmado
          # 2026-11-11 contra un init real); se completa con estas variables (ADR 0007).
          TF_CLOUD_ORGANIZATION: angel-java
          TF_WORKSPACE: mailysoft-${{ matrix.environment }}
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        working-directory: environments
        env:
          # Secreto de REPOSITORIO con nombre por entorno (research.md seccion 2) — nunca de
          # GitHub Environment, para que este job de plan no quede bloqueado por el gate de
          # aprobacion de production (FR-008).
          RAILWAY_TOKEN: ${{ matrix.environment == 'dev' && secrets.RAILWAY_TOKEN_DEV || matrix.environment == 'staging' && secrets.RAILWAY_TOKEN_STAGING || secrets.RAILWAY_TOKEN_PRODUCTION }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TFC_API_TOKEN }}
          # Confirmado 2026-11-11 contra un plan real: estas dos variables hacen falta en TODO
          # comando de Terraform contra el bloque "cloud" vacio, no solo en "init" (ADR 0007).
          TF_CLOUD_ORGANIZATION: angel-java
          TF_WORKSPACE: mailysoft-${{ matrix.environment }}
        run: |
          terraform plan -input=false -no-color \
            -var-file="${{ matrix.environment }}/environment.tfvars" \
            -var-file="${{ matrix.environment }}/database.tfvars" \
            -var-file="${{ matrix.environment }}/services.tfvars" \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Detectar cambios destructivos (FR-010)
        id: destructive
        working-directory: environments
        run: |
          # Busca acciones delete/replace (delete+create) en el plan; nunca imprime valores
          # de variables, solo un booleano derivado de los metadatos de cambio (FR-010).
          HAS_DESTRUCTIVE=$(jq -r '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length > 0' plan.json)
          echo "has_destructive=${HAS_DESTRUCTIVE}" >> "$GITHUB_OUTPUT"

      - name: Leer garantia de aislamiento y advertencia de mezcla de proveedores (FR-007/FR-014, 002-single-provider-deployment)
        id: isolation
        working-directory: environments
        run: |
          # isolation_guarantee: output raiz de environments/outputs.tf (FR-007).
          GUARANTEE=$(jq -r '.planned_values.outputs.isolation_guarantee.value // "desconocida"' plan.json)
          echo "guarantee=${GUARANTEE}" >> "$GITHUB_OUTPUT"
          # check "provider_consistency" (environments/main.tf): un check en estado
          # "fail" es la advertencia de FR-014, no un error de validate/plan.
          HAS_PROVIDER_MIX=$(jq -r '[.checks[]? | select(.status == "fail")] | length > 0' plan.json)
          echo "has_provider_mix=${HAS_PROVIDER_MIX}" >> "$GITHUB_OUTPUT"

      - name: Publicar previsualizacion en el PR (FR-008, FR-011)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = `environments/plan.txt`;
            let plan = fs.readFileSync(planPath, 'utf8');
            // El plan de Terraform ya redacta los valores marcados sensitive = true
            // (secret_refs, database_connection, connection_secret_value) — FR-011.
            const maxLen = 55000;
            if (plan.length > maxLen) {
              plan = plan.slice(0, maxLen) + "\n... (truncado)";
            }
            const destructive = '${{ steps.destructive.outputs.has_destructive }}' === 'true';
            const warning = destructive
              ? '\n> ⚠️ **CAMBIO DESTRUCTIVO**: este plan elimina o reemplaza uno o más recursos existentes. Requiere aprobación explícita antes de aplicarse (FR-010).\n'
              : '';
            const providerMix = '${{ steps.isolation.outputs.has_provider_mix }}' === 'true';
            const mixWarning = providerMix
              ? '\n> ⚠️ **MEZCLA DE PROVEEDORES**: uno o más servicios (o la base de datos) de este entorno tienen un proveedor distinto al configurado en `environment_provider`. Requiere confirmación explícita antes de aplicarse (FR-014, 002-single-provider-deployment).\n'
              : '';
            const guarantee = '${{ steps.isolation.outputs.guarantee }}';
            const guaranteeLine = `\n> 🔒 **Garantía de aislamiento API↔base en \`${{ matrix.environment }}\`**: \`${guarantee}\`${guarantee === 'credenciales' ? ' (Railway: no hay regla de red equivalente a un NSG; la garantía depende de a quién se le entregan las credenciales — ver specs/002-single-provider-deployment/research.md §2 y §4)' : ''}\n`;
            const body = `### Previsualización de Terraform — \`${{ matrix.environment }}\`${warning}${mixWarning}${guaranteeLine}\n\n<details><summary>Ver plan completo</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
