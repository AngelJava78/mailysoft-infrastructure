# Contrato: specs/001-railway-deployment/contracts/pipeline-contract.md
# En pull requests SOLO se ejecuta fmt -> validate -> lint -> security-scan -> plan (FR-008).
# Nunca se ejecuta apply aqui (ver terraform-apply.yml).

name: Terraform PR

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - "bootstrap/**"
      - ".github/workflows/terraform-pr.yml"

permissions:
  id-token: write # OIDC hacia Azure (research.md seccion 2)
  contents: read
  pull-requests: write # publicar el resultado del plan como comentario (FR-008)

env:
  TF_VERSION: "1.15.0" # confirmar version exacta disponible — research.md seccion 7
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  plan:
    name: Validar y previsualizar (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # OIDC: identidad de Azure NO acotada por entorno (ver bootstrap/azure-backend/oidc.tf);
      # la proteccion de production la aporta el gate de aprobacion de terraform-apply.yml.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --chdir=environments/${{ matrix.environment }} --config="${{ github.workspace }}/.tflint.hcl"

      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: environments/${{ matrix.environment }}
          config_file: .checkov.yaml
          quiet: true

      - name: terraform plan
        id: plan
        working-directory: environments/${{ matrix.environment }}
        env:
          # Secreto de REPOSITORIO con nombre por entorno (research.md seccion 2) — nunca de
          # GitHub Environment, para que este job de plan no quede bloqueado por el gate de
          # aprobacion de production (FR-008).
          RAILWAY_TOKEN: ${{ matrix.environment == 'dev' && secrets.RAILWAY_TOKEN_DEV || matrix.environment == 'staging' && secrets.RAILWAY_TOKEN_STAGING || secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          terraform plan -input=false -no-color \
            -var-file="environment.tfvars" \
            -var-file="database.tfvars" \
            -var-file="services.tfvars" \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Detectar cambios destructivos (FR-010)
        id: destructive
        working-directory: environments/${{ matrix.environment }}
        run: |
          # Busca acciones delete/replace (delete+create) en el plan; nunca imprime valores
          # de variables, solo un booleano derivado de los metadatos de cambio (FR-010).
          HAS_DESTRUCTIVE=$(jq -r '[.resource_changes[]? | select(.change.actions | contains(["delete"]))] | length > 0' plan.json)
          echo "has_destructive=${HAS_DESTRUCTIVE}" >> "$GITHUB_OUTPUT"

      - name: Publicar previsualizacion en el PR (FR-008, FR-011)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = `environments/${{ matrix.environment }}/plan.txt`;
            let plan = fs.readFileSync(planPath, 'utf8');
            // El plan de Terraform ya redacta los valores marcados sensitive = true
            // (secret_refs, database_connection, connection_secret_value) — FR-011.
            const maxLen = 55000;
            if (plan.length > maxLen) {
              plan = plan.slice(0, maxLen) + "\n... (truncado)";
            }
            const destructive = '${{ steps.destructive.outputs.has_destructive }}' === 'true';
            const warning = destructive
              ? '\n> ⚠️ **CAMBIO DESTRUCTIVO**: este plan elimina o reemplaza uno o más recursos existentes. Requiere aprobación explícita antes de aplicarse (FR-010).\n'
              : '';
            const body = `### Previsualización de Terraform — \`${{ matrix.environment }}\`${warning}\n\n<details><summary>Ver plan completo</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
