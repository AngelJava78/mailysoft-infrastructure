# FR-015: deteccion de drift. Solo lectura — nunca aplica ningun cambio. Si detecta
# diferencias, abre/actualiza un issue de GitHub para revision humana (research.md seccion 9).

name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 6 * * *" # diario, 06:00 UTC
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_VERSION: "1.15.0"
  TF_IN_AUTOMATION: "true"

jobs:
  check-drift:
    name: Verificar drift (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: terraform plan (solo lectura)
        id: plan
        working-directory: environments/${{ matrix.environment }}
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ matrix.environment == 'dev' && secrets.RAILWAY_TOKEN_DEV || matrix.environment == 'staging' && secrets.RAILWAY_TOKEN_STAGING || secrets.RAILWAY_TOKEN_PRODUCTION }}
        shell: bash
        run: |
          set -o pipefail
          # GitHub Actions ejecuta run: con `bash -eo pipefail`, asi que un exit code 2 de
          # `terraform plan -detailed-exitcode` (cambios detectados, no es un error) abortaria
          # el script antes de registrar el resultado si no se neutraliza con `|| true`.
          terraform plan -input=false -no-color -lock=false -detailed-exitcode \
            -var-file="environment.tfvars" \
            -var-file="database.tfvars" \
            -var-file="services.tfvars" \
            -out=driftplan | tee plan.txt || true
          # Con `cmd | tee file`, $? captura el exit code de tee (casi siempre 0), no el de
          # terraform: se usa PIPESTATUS para obtener el codigo real de `terraform plan`.
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: terraform show (si hay drift)
        if: steps.plan.outputs.exit_code == '2'
        working-directory: environments/${{ matrix.environment }}
        run: terraform show -no-color driftplan >> plan.txt

      - name: Abrir o actualizar issue de drift (FR-015)
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`environments/${{ matrix.environment }}/plan.txt`, 'utf8');
            if (plan.length > 55000) plan = plan.slice(0, 55000) + "\n... (truncado)";
            const title = `Drift detectado en ${{ matrix.environment }}`;
            const body = `La infraestructura real de \`${{ matrix.environment }}\` difiere de la configuración versionada (FR-015). Ningún cambio se aplicó automáticamente; revisar y corregir manualmente o re-ejecutar el pipeline de apply tras aprobar el cambio correspondiente.\n\n<details><summary>Ver diferencia</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "drift"
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["drift", "${{ matrix.environment }}"] });
            }

      - name: Fallar el job si hubo un error real de plan (exit_code 1)
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1
